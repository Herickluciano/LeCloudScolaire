<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logoedulink.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edulink — Le Lien Éducatif</title>
    
    <!-- 🟢 CONFIGURATION DE SÉCURITÉ GRAPHIQUE LUHAMCODE -->
    <style>
      body {
        margin: 0;
        padding: 0;
        color: #000000 !important;
        background-color: #f8fafc !important; /* Fond gris très clair de base */
        position: relative;
        min-height: 100vh;
      }

      /* Rendu du filigrane fixe en arrière-plan de toutes les pages */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -9999; /* Derrière absolument tout */
        background-image: url("/logoedulink.png"); /* Pointage direct et propre dans le dossier public */
        background-repeat: no-repeat;
        background-position: center center;
        background-size: 450px;
        opacity: 0.06; /* 6% d'opacité : visible mais n'agresse pas la lecture */
        pointer-events: none;
      }

      /* 🟢 LE SECRET : On force le conteneur root de React à être transparent */
      #root {
        background-color: transparent !important;
        position: relative;
        z-index: 1;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
